name: Todo Service Tests
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r services/todo/requirements.txt
      - name: Run tests
        working-directory: services/todo
        run: python -m pytest -v
